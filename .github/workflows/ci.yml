name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

jobs:
  test:
    name: lint, format, unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock has drifted from pyproject.toml, so a stale
        # lockfile surfaces here rather than as a mismatched environment.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Unit tests
        # Integration tests are excluded: they call live WFS services (PDOK/RWS),
        # which makes them slow and dependent on upstream schema stability.
        # Run them locally with: ./run_tests.sh -m integration
        run: uv run pytest tests/ -m "not integration" --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
