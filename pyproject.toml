[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "wocu-oevererosie"
version = "1.0.0"
description = "River bank erosion prediction for Dutch rivers"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Geospatial
    "numpy<=2.2",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "geopandas>=0.14.0",
    "pyogrio>=0.7.0",
    "pyproj>=3.5.0",
    "shapely>=2.0.0",
    # Modelling
    "scikit-learn>=1.3.0",
    "lightgbm>=4.6.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
    # Figures and maps
    "matplotlib>=3.7.0",
    "contextily>=1.7.1",
    # Station lookup (scripts/data_prep)
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "python-pptx>=1.0.0",  # scripts/slides
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by the formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["F401", "F811"]  # allow unused imports and redefinitions in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]
