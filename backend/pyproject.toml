[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[project]
name = "wocu-oevererosie-backend"
version = "1.0.0"
description = "River bank erosion prediction backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    # Data validation and settings
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    # Geospatial libraries
    "numpy<=2.2",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "geopandas>=0.14.0",
    "pyproj>=3.5.0",
    "shapely>=2.0.0",
    "owslib>=0.29.0",
    # Machine Learning
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.42.0",
    # HTTP client (for WFS requests)
    "httpx>=0.25.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-asyncio>=0.21.0",
    # Code quality
    "black>=23.0.0",
    "ruff>=0.1.0",
    # Jupyter and visualization
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "folium>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "altair>=5.0.0",
    "plotly>=5.16.0",
    "lightgbm>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=app",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["app", "src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["F401", "F811"]  # allow unused imports and redefinitions in tests

[tool.ruff.isort]
known-first-party = ["app", "src"]
